version: '3.4'
services:
  weaviate:
    image: semitechnologies/weaviate:1.30.15
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - QUERY_DEFAULTS_LIMIT=25
      - ENABLE_MODULES=
      - ENABLE_GRPC=true
    volumes:
      - ./weaviate_data:/var/lib/weaviate
