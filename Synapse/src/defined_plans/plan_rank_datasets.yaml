task_scope:
  filter_type: paper_id
  query: "face,flat,uae,neurocard"

outputs:
  - rank_datasets

nodes:
  - id: retrieve_experiment
    type: retrieve
    mode: local
    handler: default
    inputs:
      - section["Experiment"]
    retrieval_strategy: tag
  - id: rank_datasets
    type: rank
    mode: local
    handler: rank_datasets
    inputs:
      - output["retrieve_experiment"]

edges:
  - from: retrieve_experiment
    to: rank_datasets