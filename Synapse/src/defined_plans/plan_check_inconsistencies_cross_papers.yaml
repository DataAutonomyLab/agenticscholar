task_scope:
  filter_type: paper_id
  query: "face,flat,uae,neurocard"

outputs:
  - check_inconsistencies_cross_papers

nodes:
  - id: retrieve_experiment
    type: retrieve
    mode: local
    handler: default
    inputs:
      - section["Experiment"]
    retrieval_strategy: tag
  - id: extract_exp_settings
    type: extract
    mode: local
    handler: extract_exp_settings
    inputs:
      - output["retrieve_experiment"]
  - id: extract_comp_baselines
    type: extract
    mode: local
    handler: extract_comp_baselines
    inputs:
      - output["retrieve_experiment"]
  - id: summarize_common_settings
    type: summarize
    mode: global
    handler: summarize_common_settings
    inputs:
      - output["extract_exp_settings"]
  - id: check_inconsistencies_cross_papers
    type: check
    mode: global
    handler: check_inconsistencies_cross_papers
    inputs:
      - output["extract_exp_settings"]
      - output["summarize_common_settings"]
      - output["extract_comp_baselines"]

edges:
  - from: retrieve_experiment
    to: extract_exp_settings
  - from: retrieve_experiment
    to: extract_comp_baselines
  - from: extract_exp_settings
    to: check_inconsistencies_cross_papers
  - from: extract_exp_settings
    to: summarize_common_settings
  - from: summarize_common_settings
    to: check_inconsistencies_cross_papers
  - from: extract_comp_baselines
    to: check_inconsistencies_cross_papers