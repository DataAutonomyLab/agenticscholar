task_scope:
  filter_type: paper_id
  query: "face,flat,uae,neurocard"

outputs:
  - extract_problem_def

nodes:
  - id: retrieve_problem_def
    type: retrieve
    mode: local
    handler: default
    inputs:
      - section["Problem Definition"]
    retrieval_strategy: tag
  - id: extract_problem_def
    type: extract
    mode: local
    handler: extract_problem_def
    inputs:
      - output["retrieve_problem_def"]

edges:
  - from: retrieve_problem_def
    to: extract_problem_def