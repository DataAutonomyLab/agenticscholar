task_scope:
  filter_type: paper_id
  query: "text2sql_p7"

outputs:
  - extract_method

nodes:
  - id: retrieve_method
    type: retrieve
    mode: local
    handler: default
    inputs:
      - section["Method"]
    retrieval_strategy: tag
  - id: extract_method
    type: extract
    mode: local
    handler: extract_method
    inputs:
      - output["retrieve_method"]

edges:
  - from: retrieve_method
    to: extract_method