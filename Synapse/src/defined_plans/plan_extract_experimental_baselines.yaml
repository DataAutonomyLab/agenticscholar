task_scope:
  filter_type: paper_id
  query: "face,flat,uae,neurocard"

outputs:
  - extract_exp_settings_baselines

nodes:
  - id: retrieve_experiment
    type: retrieve
    mode: local
    handler: default
    inputs:
      - section["Experiment"]
    retrieval_strategy: tag
  - id: extract_exp_settings_baselines
    type: extract
    mode: local
    handler: extract_exp_settings_baselines
    inputs:
      - output["retrieve_experiment"]

edges:
  - from: retrieve_experiment
    to: extract_exp_settings_baselines