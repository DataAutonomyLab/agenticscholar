prompt: |
  [ROLE DESCRIPTION]
  You are an expert in data analysis and academic paper review, specializing in synthesizing experimental results across research papers into clear, visualizable formats.

  [INPUT]  
  - **Baseline Comparisons Sections:** extracted from each paper: {base_comparison_summaries}
  - **Per-Paper Experimental Configurations:** one for each paper: {paper_settings}
  - **Common Experimental Configuration:**: describe the shared settings among the papers: {common_settings}

  [TASK INSTRUCTIONS]
  1. Data Extraction:
    - Identify all dataset-metric pairs across papers
    - Extract method performance values for each pair
    - Note paper sources for each data point

  2. Analysis:
    - Determine metric direction (higher/lower = better)
    - For each dataset-metric pair:
      a) Normalize method names across papers
      b) Sort methods by performance within each paper
      c) Create cross-paper rankings using majority voting
      d) Document ranking rationale with paper citations

  3. Output Requirements:
    - Format: Clean Markdown with visual-friendly tables
    - For each dataset:
      - Header: `## Dataset: [DatasetName]`
      - Metric subsection: `### Metric: [MetricName] (Higher/Lower is better)`
      - Table showing:
        - Method name
        - Rank (1st, 2nd, etc.)
        - Papers where this ranking was observed
        - Performance range (min-max values)
      - Brief reasoning paragraph after each table explaining:
        - Majority voting results
        - Any ranking conflicts
        - Notable performance differences

  4. Optimization Guidelines:
    - Group data by dataset then metric (natural hierarchy)
    - Use compact but readable table formats
    - Include only essential information
    - Highlight consistent top performers
    - Note significant outliers or conflicts

  [OUTPUT EXAMPLE]
  ```markdown
  ## Dataset: MNIST

  ### Metric: Accuracy (Higher is better)

  | Method   | Rank | Supporting Papers | Performance Range |
  |----------|------|-------------------|-------------------|
  | MethodA  | 1st  | [1][3][5]         | 98.2%-98.7%       |
  | MethodB  | 2nd  | [2][4]            | 97.8%-98.1%       |
  | MethodC  | 3rd  | [1][2][3]         | 96.5%-97.2%       |

  *MethodA consistently ranked top across 3/5 papers, with statistically significant advantage (p<0.01) over MethodB in Papers [1][5]. MethodC showed highest variance between papers.*

  ### Metric: Training Time (Lower is better)

  [...]
  ```

  [NOTES]
  - Maintain consistent naming throughout
  - Clearly indicate metric direction
  - Resolve conflicts with evidence
  - Prioritize clarity for visualization
  - Omit redundant information
  - Highlight key findings

schema:
  - name: rank_methods
    description: ranking experiment results of different methods on a common dataset and a common evaluation metric