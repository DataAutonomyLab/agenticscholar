prompt: |
  [ROLE DESCRIPTION]
  You will act as a structured data extraction assistant for academic papers from various domains. 

  [TASK DESCRIPTION]
  You will be provided with the experimental section of a paper, including its texts, figures and tables. 
  Your task is to generate a standardized JSON object that captures all key experimental details necessary 
  for reproducing the experiment, regardless of the specific discipline. Carefully examine all provided 
  materials—text, figures, and tables—to extract the required information, paying special attention to 
  references in the text to figures, tables, or sections, and extract relevant data directly from those 
  sources.

  [INPUT]
  Here is the experimental section of a paper, which includes various details about datasets, evaluation 
  metrics, baselines, and experimental environments.

  {section_text}

  [INSTRUCTIONS]
  Follow these instructions rigorously:
  ### 1. Data Extraction
  - Parse the provided text, figures, and tables to extract the following information:
    - **Datasets**:
      - Note: "Datasets" broadly refers to any data, samples, materials, or systems used in the experiment.
      - Extract names, detailed descriptions, and sources (e.g., citations or table/figure references).
      - The description should include all available details, such as size, composition, preprocessing steps, specific characteristics, and values if provided in text, tables, or figures.
      - Additionally, include specific configuration details (e.g., data splits, sample preparation methods) under a "configuration" field, interpreted according to the domain.
    - **Evaluation Metrics**:
      - Quantitative and qualitative measures used to assess performance or results.
      - Include their exact definitions, formulas, or calculation methods if specified in the text, figures, or tables.
    - **Baselines**:
      - Note: "Baselines" refers to all methods, algorithms, conditions, or entities used for comparison, including those proposed in the paper and any external references, as long as they participate in the result comparison.
      - Extract all baseline information, including version numbers, citations, and specific configurations or parameters (e.g., learning rate, experimental conditions) if provided in text, tables, or figures.
    - **Experiment Environment**:
      - Comprehensive details about the experimental environment, including:
        - **Hardware or Equipment**: e.g., GPU/CPU models, lab instruments.
        - **Software**: If applicable, e.g., libraries, frameworks, and their versions.
        - **Parameters**: e.g., learning rate, batch size, temperature, pressure, etc.
        - **Procedures**: Steps or protocols followed, e.g., training steps, experimental operations.
      - Source this information from text, tables, or figures.
    - **Additional Context**:
      - Any other critical details necessary to fully reproduce the experiment, such as data augmentation techniques, optimization algorithms, loss functions, specific conditions, or custom modifications to standard procedures, extracted from all available sources.
  - When the text references figures, tables, or section labels (e.g., "Table 3 shows accuracy comparisons"), extract the specific numeric values, configurations, or details directly from the referenced figures or tables.

  ### 2. Normalization Rules
  - Enforce consistent naming conventions (e.g., use "Method A" instead of "method_a").
  - Replace ambiguous terms like "standard settings" with explicit values if they can be determined from the text, figures, or tables.
  - If explicit values are unavailable but can be reasonably inferred from context, provide the inferred value with an explanation (see Evidence Attribution).
  - For any fields where information is not explicitly stated and cannot be reasonably inferred, assign a value of `null` and list these fields in the "missing_evidence" array.

  ### 3. Evidence Attribution
  - For each field in the JSON object, include a "source" attribute that cites the exact text excerpt (e.g., a direct quote or paraphrase with location like "paragraph 2 of Section 3.1"), figure/table label (e.g., "Table 3"), or original section title from which the information was derived.
  - Use the original chapter or section titles as they appear in the paper; do not renumber sections.
  - For values inferred rather than explicitly stated, include an "inferred_from" attribute explaining the basis for the inference (e.g., "inferred_from": "based on common practice for this type of experiment as no specific value was provided").

  [OUPUT]
  ### 4. Output Format
  - Generate your final output in valid JSON format, adhering strictly to the following schema:

  ```json
  {{
    "paper_id": "[unique identifier]",
    "datasets": [
      {{
        "name": "[dataset_name]",
        "description": "[detailed description including size, composition, preprocessing, values if available, etc.]",
        "source": "[text reference | table/figure label | original section title]",
        "configuration": {{
          "details": "[configuration details, e.g., data splits, sample preparation methods]",
          "source": "[text reference | table/figure label | original section title]"
        }}
      }}
    ],
    "evaluation_metrics": [
      {{
        "metric": "[name]",
        "description": "[definition, formula, or usage details]",
        "source": "[text reference | table/figure label | original section title]"
      }}
    ],
    "baselines": [
      {{
        "name": "[baseline_name]",
        "configuration": "[specific settings or parameters]",
        "source": "[text reference | table/figure label | original section title]"
      }}
    ],
    "experiment_environment": {{
      "hardware": "[hardware or equipment description]",
      "software": "[software description, if applicable]",
      "parameters": "[experiment parameters description]",
      "procedures": "[experiment procedures description]",
      "source": "[text reference | table/figure label | original section title]"
    }},
    "additional_info": {{
      "key_details": "[critical reproduction notes, e.g., data augmentation, loss functions]",
      "assumptions": "[explicitly stated or inferred assumptions]",
      "source": "[text reference | table/figure label | original section title]"
    }},
    "missing_evidence": ["[list fields lacking explicit documentation in the provided materials]"]
  }}

schema:
  - name: experimental_settings
    description: The experimental settings of a paper