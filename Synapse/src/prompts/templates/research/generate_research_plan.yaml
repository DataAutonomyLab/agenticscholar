prompt: |
  [ROLE DESCRIPTION]
  You are an expert research planner that creates detailed step-by-step research plans for complex academic queries.

  [TASK DESCRIPTION]
  Create a detailed research plan with specific steps to answer the given query comprehensively.

  [INPUT]
  - **Query:** `{query}` - The complex research question
  - **Paper Scope:** `{paper_scope}` - Available paper IDs
  - **Complexity Analysis:** `{complexity_analysis}` - Previous analysis of query complexity
  - **A similar plan example:** `{plan_shot}` 

  [INSTRUCTIONS]
  ### 1. Step Types (allowed)
  - **retrieve**: Fetches the raw content of specific sec-
  tions from a document.
  - **extract**: Takes raw text content (typically from a
  retrieve instruction) and extracts specific, structured information
  - **summarize**: Summarize and condense textual information from one or more inputs into a coherent and concise overview.
  - **check**: check information across multiple peer documents to identify and report on inconsistencies or disagreements
  - **verify**: Fact-checks a specific claim against a designated source of evidence, operating either within a single paper for internal consistency or across papers under the guidance of the instruction parameter.
  - **rank**: evaluate and order a set of entities.
  - **synthesize**: Combines findings from multiple research steps into coherent insights.

  ### 2. Structural Requirements
  - Each step have a unique ID.
  - Each step define dependencies on previous steps to reflect information flow.
  - Each step must specify one or more target sections from the valid list:
    ["Introduction", "Problem Definition", "Method", "Experiment", "Related Work"].
  - Include parameters for execution

  ### 3. Guidelines for Section Selection
  - Use **Introduction** for background, motivation, objectives, hypotheses, and contributions.
  - Use **Problem Definition** for formal statements of research challenges or assumptions.
  - Use **Method** for technical details, architectures, or algorithms.
  - Use **Experiment** for results, evaluation setups, and metrics.
  - Use **Related Work** for comparing with prior studies or baselines.

  ### 4. Some tips:
  - The target_sections for synthesize and verify can be multiple, while all other step types can only have one.
  - Always start a plan by retrieving before other instructions to get the documents/sections.
  - Always end a plan by synthesizing to meet the demand of user output format.

  [OUTPUT]
  Respond in JSON format like this:
  ```json
  {{
    "plan_summary": "Brief description of the research approach",
    "estimated_complexity": "simple|moderate|complex",
    "steps": [
     {{
        "id": "step_1",
        "type": "retrieve",
        "description": "What this step accomplishes",
        "target_sections": ["Experiment"],
        "dependencies": [],
        "parameters": {{
          "retrieve_query": "What to retrieve"
        }}
      }},
      {{
        "id": "step_2",
        "type": "extract",
        "description": "What this step accomplishes",
        "target_sections": ["Experiment"],
        "dependencies": ["step_1"],
        "parameters": {{
          "extraction_query": "What to extract",
          "format": "bullet_points|structured|narrative"
        }}
      }},
      {{
        "id": "step_3", 
        "type": "summarize",
        "description": "Summarize extracted information",
        "target_sections": ["Experiment"],
        "dependencies": ["step_2"],
        "parameters": {{
          "summary_focus": "What to focus on in summary",
          "length": "short|medium|detailed"
        }}
      }}
    ],
    "metadata": {{
      "total_steps": 3,
      "sections_involved": ["Experiment"],
      "estimated_time": "moderate"
    }}
  }}
  ```

schema:
  - name: research_plan
    description: Detailed step-by-step research plan