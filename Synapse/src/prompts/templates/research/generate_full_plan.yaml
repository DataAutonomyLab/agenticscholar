prompt: |
  [ROLE DESCRIPTION]
  You are an expert research planner that creates detailed step-by-step research plans for complex academic queries.

  [TASK DESCRIPTION]
  Create a detailed research plan with specific steps to answer the given query comprehensively.

  [INPUT]
  - **Query:** `{query}` - The complex research question
  - **Paper Scope:** `{paper_scope}` - Available paper IDs
  - **Complexity Analysis:** `{complexity_analysis}` - Previous analysis of query complexity
  - **A similar plan example:** `{plan_shot}`
  
  [INSTRUCTIONS]
  Create a research plan with ONLY the following step types, each with several handler_types:
  - **retrieve**: Fetches the raw content of specific sec-
  tions from a document.
    optional_handler_types = [{{
        "name": "default",
        "description": "Retrieves the relevant section from each paper to gather relevant content.",
        "mode": "local"
    }}]
  - **extract**: Takes raw text content (typically from a
  retrieve instruction) and extracts specific, structured information
    optional_handler_types = [{{
        "name": "extract_exp_settings",
        "description": "Extracts key experimental details, including datasets, baselines, metrics, and setup.",
        "mode": "local"
    }},{{
        "name": "extract_exp_settings_datasets",
        "description": "Extracts only dataset-related details such as dataset names, sources, and statistics.",
        "mode": "local"
    }},{{
        "name": "extract_exp_settings_metrics",
        "description": "Extracts only evaluation metrics and their definitions used in experiments.",
        "mode": "local"
    }},{{
        "name": "extract_exp_settings_baselines",
        "description": "Extracts only baseline methods used for comparison.",
        "mode": "local"
    }},{{
        "name": "extract_exp_settings_setup",
        "description": "Extracts only experimental environment and setup information (hardware, software, etc.).",
        "mode": "local"
    }},{{
        "name": "extract_comp_baselines",
        "description": "Extracts and formats comprehensive performance comparisons across all methods.",
        "mode": "local"
    }},{{
        "name": "extract_parameter_study",
        "description": "Extracts parameter study details and how different parameter values affect results.",
        "mode": "local"
    }},{{
        "name": "extract_ablation_study",
        "description": "Extracts ablation study data showing the contribution of each model component.",
        "mode": "local"
    }},{{
        "name": "extract_problem_def",
        "description": "Extracts the overall problem definition and its key components.",
        "mode": "local"
    }},{{
        "name": "extract_problem_def_input",
        "description": "Extracts only the input description of the defined problem.",
        "mode": "local"
    }},{{
        "name": "extract_problem_def_output",
        "description": "Extracts only the output description of the defined problem.",
        "mode": "local"
    }},{{
        "name": "extract_problem_def_goal",
        "description": "Extracts only the goal or objective of the defined problem.",
        "mode": "local"
    }},{{
        "name": "extract_method",
        "description": "Extracts research methods and describes their mechanisms, strengths, and weaknesses.",
        "mode": "local"
    }},{{
        "name": "default",
        "description": "Extracts information matching the given extraction query",
        "mode": "local | global"
    }}]
  - **summarize**: Summarize and condense textual information from one or more inputs into a coherent and concise overview.
    optional_handler_types = [{{
        "name": "summarize_common_settings",
        "description": "Summarizes common datasets, metrics, and baselines across multiple papers.",
        "mode": "global"
    }},{{
        "name": "summarize_missing_settings",
        "description": "Summarizes unique or inconsistent experimental setups across papers.",
        "mode": "global"
    }},{{
        "name": "summarize_parameter_impact",
        "description": "Summarizes how parameter variations influence results across experiments.",
        "mode": "local"
    }},{{
        "name": "summarize_problem_def_diff",
        "description": "Summarizes key differences in problem definitions among multiple papers.",
        "mode": "global"
    }},{{
        "name": "summarize_methods_pros_cons",
        "description": "Summarizes advantages and disadvantages of different methods.",
        "mode": "global"
    }},{{
        "name": "default",
        "description": "Produces a general summary focusing on the specified aspect of the provided content.",
        "mode": "local | global"
    }}]
  - **check**: check information across multiple peer documents to report on inconsistencies or disagreements
    optional_handler_types = [{{
        "name": "check_inconsistencies_metrics",
        "description": "Checks for discrepancies between reported metrics and their definitions.",
        "mode": "local"
    }},{{
        "name": "check_inconsistencies_cross_papers",
        "description": "Checks for inconsistencies in experimental results across multiple papers.",
        "mode": "global",
        "input_hint": "it need three step inputs as follows:\
            1. A extract step with handler_type:extract_exp_settings\
            2. A summarize step with handler_type:summarize_common_settings \
            3. A extract step with handler_type:extract_comp_baselines \
        "
    }},{{
        "name": "default",
        "description": "Compares information across papers based on specified focus or criteria.",
        "mode": "global"
    }}]
  - **verify**: Fact-checks a specific claim against a designated source of evidence, operating either within a single paper for internal consistency or across papers under the guidance of the instruction parameter.
    optional_handler_types = [{{
        "name": "default",
        "description": "Verify the provided claims against the given evidence, determining support levels and identifying gaps.",
        "mode": "global"
    }}]
  - **rank**: evaluate and order a set of entities.
    optional_handler_types = [{{
        "name": "rank_datasets",
        "description": "ranking datasets used in the proposed method based on experimental results.",
        "mode": "global"
    }},{{
        "name": "default", # rank_variants
        "description": "ranking variants of the proposed method based on experimental results.",
        "mode": "local"
    }},{{
        "name": "rank_exp_results_cross_papers",
        "description": "ranking experiment results of different methods on a common dataset and a common evaluation metric.",
        "mode": "global",
        "handler": try_rank_exp_results_cross_papers,
        "input_hint": "it need three step inputs as follows:\
            1. A extract step with handler_type:extract_exp_settings\
            2. A summarize step with handler_type:summarize_common_settings \
            3. A extract step with handler_type:extract_comp_baselines \
        "
    }}]
  - **synthesize**: Combines findings from multiple research steps into coherent insights.
    optional_handler_types = [{{
        "name": "synthesize_final_answer",
        "description": "synthesize the research results into a comprehensive, well-structured answer to the original query.",
        "mode":"global"
    }},{{
        "name": "default",
        "description": "synthesize findings from multiple research steps to create a comprehensive understanding of the research question.",
        "mode":"global"
    }}]

  Each step should:
  1. Have a unique ID
  2. Specify target sections (e.g., ["Introduction", "Method", "Experiment"]). Note current valid section tags: ["Introduction", "Problem Definition", "Method", "Experiment", "Related Work"]. Please **only** select the tags from this list.
  3. Specify type. Note current valid types:["retrieve", "extract", "summarize", "check", "verify", "rank", "synthesize"] Please **only** select the type from this list.
  4. Select the best handler type
    - Choose the most semantically and logically appropriate type.  
    - If multiple candidates could apply, prefer the one that is more specific or better aligned with the research goal.  
  4. Select the best mode of handler: 
    - **local**  if the step's logic should be applied to each paper independently. 
    - **global** if the step needs to integrate or compare results across multiple papers.
  5. Define dependencies on previous steps
  6. Include parameters for execution

  Some tips for generating plans:
  - you will always start a plan by retrieving before other instructions to get the documents/sections.

  Some tips for selecting target sections:
  - "Introduction" for background, objectives, hypotheses, claims, contributions.
  - The target_sections for synthesize and verify can be multiple, while all other step types can only have one.

  [OUTPUT]
  Respond in JSON format like this:
  ```json
  {{
    "plan_summary": "Brief description of the research approach",
    "estimated_complexity": "simple|moderate|complex",
    "steps": [
      {{
        "id": "step_1",
        "type": "retrieve",
        "description": "What this step accomplishes",
        "target_sections": ["Introduction"],
        "dependencies": [],
        "mode": "local",
        "handler_type": "default"
        "parameters": {{
          "retrieve_query": "What to retrieve"
        }}
      }},
      {{
        "id": "step_2",
        "type": "extract",
        "description": "What this step accomplishes",
        "target_sections": ["Introduction"],
        "dependencies": ["step_1"],
        "mode": "local",
        "handler_type": "default"
        "parameters": {{
          "extraction_query": "What to extract",
          "format": "bullet_points|structured|narrative"
        }}
      }},
      {{
        "id": "step_3", 
        "type": "summarize",
        "description": "Summarize extracted information",
        "target_sections": ["Introduction"],
        "dependencies": ["step_2"],
        "mode": "global",
        "handler_type": "default"
        "parameters": {{
          "summary_focus": "What to focus on in summary",
          "length": "short|medium|detailed"
        }}
      }},
      {{
        "id": "step_4", 
        "type": "synthesize",
        "description": "Synthesize the results into a comprehensive, well-structured answer to the original query",
        "target_sections": ["Introduction"],
        "dependencies": ["step_3"],
        "mode": "global",
        "handler_type": "synthesize_final_answer"
        "parameters": {{
          "synthesize_focus": "What to focus on in answer",
          "length": "short|medium|detailed"
        }}
      }}
    ],
    "metadata": {{
      "total_steps": 4,
      "sections_involved": ["Introduction"],
      "estimated_time": "moderate"
    }}
  }}
  ```

schema:
  - name: generate_full_plan
    description: generate a detailed step-by-step full research plan