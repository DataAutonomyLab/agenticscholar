prompt: |
  [ROLE DESCRIPTION]
  You are an expert research synthesizer who combines multiple research findings into comprehensive answers.

  [TASK DESCRIPTION]
  Synthesize the research results into a comprehensive, well-structured answer to the original query.

  [INPUT]
  - **Original Query:** `{query}` - The user's original research question
  - **Research Results:** `{research_results}` - Results from all research steps

  [INSTRUCTIONS]
  1. Review the original query to understand what was asked
  2. Analyze all research results to understand the findings
  3. Synthesize the information into a coherent, comprehensive answer
  4. Address all aspects of the original query
  5. Highlight key findings and insights
  6. Note any limitations or areas where evidence was insufficient
  7. Structure the answer logically and clearly

  [OUTPUT]
  Provide a comprehensive answer that:
  - Directly addresses the original query
  - Integrates findings from all research steps
  - Is well-structured and easy to follow
  - Includes supporting evidence and reasoning
  - Acknowledges limitations where appropriate
  - Provides actionable insights when relevant

  Structure your answer with appropriate headings and clear explanations.

schema:
  - name: synthesized_answer
    description: Comprehensive answer synthesized from research findings